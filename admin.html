<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品管理后台 | HEILIGS PIER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261043" />
  <style>
    body { background: #f5f5f0; }
    .admin-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }
    .admin-header h1 {
      font-family: 'Jost', sans-serif;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: #1a1a1a;
    }
    .admin-header .actions {
      display: flex;
      gap: 12px;
    }
    .admin-btn {
      padding: 8px 20px;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .admin-btn:hover { background: #1a1a1a; color: #fff; }
    .admin-btn.primary { background: #1a1a1a; color: #fff; }
    .admin-btn.primary:hover { background: #333; }
    .admin-btn.danger { border-color: #c0392b; color: #c0392b; }
    .admin-btn.danger:hover { background: #c0392b; color: #fff; }

    .admin-grid {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 32px;
    }
    @media (max-width: 900px) {
      .admin-grid { grid-template-columns: 1fr; }
    }

    /* 表单区 */
    .admin-form {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      height: calc(100vh - 140px);
      overflow-y: auto;
      box-sizing: border-box;
    }
    @media (max-width: 900px) {
      .admin-form { height: auto; overflow: visible; }
    }
    .admin-form h2 {
      font-family: 'Jost', sans-serif;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-group input[type="text"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Jost', 'Noto Sans SC', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fafafa;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    .form-group input[type="text"]:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #1a1a1a;
      background: #fff;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* 图片上传区 */
    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
    }
    .upload-area:hover { border-color: #1a1a1a; background: #fafafa; }
    .upload-area p {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      color: #999;
      margin: 0;
    }
    .upload-area .icon {
      font-size: 32px;
      color: #ccc;
      margin-bottom: 8px;
    }
    .upload-preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    /* 拖拽排序时拖到缩略图右侧/下方的空白区域 → 放到最后一位 */
    .upload-preview.drag-zone {
      outline: 2px dashed #b0895a;
      outline-offset: 6px;
      border-radius: 10px;
    }
    .upload-preview .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #ddd;
      cursor: grab;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .upload-preview .preview-item:hover {
      border-color: #999;
    }
    .upload-preview .preview-item.dragging {
      opacity: 0.4;
      cursor: grabbing;
    }
    .upload-preview .preview-item.drag-over {
      border-color: #1a1a1a;
      border-width: 2px;
    }
    .upload-preview .preview-item .drag-handle {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      pointer-events: none;
    }
    .upload-preview .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .upload-preview .preview-item .remove-img {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* 产品列表区 */
    .product-admin-list {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      box-sizing: border-box;
    }
    @media (max-width: 900px) {
      .product-admin-list { height: auto; max-height: none; }
    }
    .product-admin-list .list-header {
      flex-shrink: 0;
      margin-bottom: 16px;
    }
    .product-admin-list .list-filters {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .product-admin-list .filter-item {
      flex: 0 0 auto;
    }
    .product-admin-list .filter-item select {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Jost', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      color: #333;
      background: #fafafa;
      box-sizing: border-box;
      transition: border-color 0.3s;
      cursor: pointer;
    }
    .product-admin-list .filter-item select:focus {
      outline: none;
      border-color: #1a1a1a;
      background: #fff;
    }
    .product-admin-list .filter-search {
      position: relative;
      flex: 1 1 180px;
      min-width: 160px;
    }
    .product-admin-list .filter-search input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Jost', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      color: #333;
      background: #fafafa;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .product-admin-list .filter-search input:focus {
      outline: none;
      border-color: #1a1a1a;
      background: #fff;
    }
    .product-admin-list .filter-search .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #999;
      pointer-events: none;
    }
    .product-admin-list .scroll-area {
      flex: 1;
      overflow-y: auto;
      min-height: 200px;
    }
    .product-admin-list .scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .product-admin-list .scroll-area::-webkit-scrollbar-track {
      background: #f5f5f5;
      border-radius: 3px;
    }
    .product-admin-list .scroll-area::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }
    .product-admin-list .scroll-area::-webkit-scrollbar-thumb:hover {
      background: #999;
    }
    .product-admin-list h2 {
      font-family: 'Jost', sans-serif;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    .admin-product-item {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
    }
    .admin-product-item:last-child { border-bottom: none; }
    .admin-product-item .thumb {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #eee;
      flex-shrink: 0;
      background: #f9f9f9;
    }
    .admin-product-item .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .admin-product-item .info {
      flex: 1;
      min-width: 0;
    }
    .admin-product-item .info h3 {
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 4px;
    }
    .admin-product-item .info p {
      font-size: 12px;
      color: #999;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .admin-product-item .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #f0f0f0;
      font-size: 11px;
      color: #666;
      margin-right: 8px;
    }
    .admin-product-item .item-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .admin-product-item .item-actions button {
      padding: 6px 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      transition: all 0.3s;
    }
    .admin-product-item .item-actions .edit-btn:hover {
      border-color: #1a1a1a;
      color: #1a1a1a;
    }
    .admin-product-item .item-actions .del-btn:hover {
      border-color: #c0392b;
      color: #c0392b;
    }

    /* 留言信息区 */
    .product-admin-list.message-admin-list {
      margin-top: 32px;
      height: auto;
      max-height: 620px;
    }
    .message-admin-list .admin-product-item { align-items: flex-start; }
    .message-admin-list .admin-product-item .info p {
      white-space: normal;
      overflow: visible;
      color: #555;
      line-height: 1.7;
      word-break: break-word;
    }

    /* 拖拽排序 */
    .drag-handle {
      flex-shrink: 0;
      width: 22px;
      color: #bbb;
      font-size: 16px;
      letter-spacing: 0;
      cursor: grab;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 4px;
      touch-action: none;
    }
    .drag-handle:active { cursor: grabbing; color: #888; }
    .admin-product-item.drag-item { transition: opacity 0.15s, background 0.15s; }
    .admin-product-item.is-selected {
      background: #faf6ed !important;
      box-shadow: inset 3px 0 0 #c4a97a;
    }
    .row-checkbox {
      flex-shrink: 0;
      width: 16px; height: 16px;
      margin-right: 8px;
      cursor: pointer;
      accent-color: #8a7a5a;
    }
    .drag-toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      background: #faf6ed;
      border-radius: 6px;
      border-left: 3px solid #c4a97a;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
    }
    .drag-toolbar__select {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; color: #5a4d32;
    }
    .drag-toolbar__select input { accent-color: #8a7a5a; width: 15px; height: 15px; }
    .drag-toolbar__hint {
      color: #a09070; font-size: 12px;
    }
    /* 幽灵副本 */
    .drag-ghost {
      opacity: 0.85;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      border-radius: 6px;
      background: #fff;
      z-index: 9999;
      pointer-events: none;
      transform-origin: center;
      transition: transform 0.08s ease-out;
    }
    /* 插入指示线 */
    .drag-hint-line {
      position: fixed;
      height: 3px;
      background: linear-gradient(90deg, #c4a97a, #d4bb8a, #c4a97a);
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(196, 169, 122, 0.5);
      z-index: 9998;
      pointer-events: none;
    }
    .drag-hint {
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      color: #8a7a5a;
      background: #faf6ed;
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      border-left: 3px solid #c4a97a;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #ccc;
    }
    .empty-state p {
      font-family: 'Jost', sans-serif;
      font-size: 14px;
    }

    .admin-back-link {
      display: inline-block;
      margin-bottom: 20px;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      color: #666;
      text-decoration: none;
    }
    .admin-back-link:hover { color: #1a1a1a; }

    /* 确认对话框 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .modal-box h3 {
      font-family: 'Jost', sans-serif;
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 8px;
    }
    .modal-box p {
      font-size: 14px;
      color: #666;
      margin: 0 0 24px;
    }
    .modal-box .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .modal-box .modal-actions button {
      padding: 10px 28px;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      font-family: 'Jost', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .modal-box .modal-actions .confirm-btn {
      background: #1a1a1a;
      color: #fff;
    }
    .modal-box .modal-actions .confirm-btn:hover { background: #333; }
    .modal-box .modal-actions .cancel-btn {
      background: #fff;
      color: #1a1a1a;
    }
    .modal-box .modal-actions .cancel-btn:hover { background: #f5f5f5; }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <a href="index.html" class="admin-back-link">← 返回首页</a>

    <div class="admin-header">
      <h1>产品管理后台</h1>
      <div class="actions">
        <button class="admin-btn" id="importHtmlBtn">从HTML导入现有产品</button>
        <button class="admin-btn" id="exportBtn">导出数据</button>
        <button class="admin-btn" id="importBtn">导入数据</button>
        <input type="file" id="importFile" accept=".json" style="display:none" />
        <a href="bedding.html" class="admin-btn primary">查看前台</a>
      </div>
    </div>

    <div class="admin-grid">
      <!-- 左侧表单 -->
      <div class="admin-form">
        <h2 id="formTitle">添加新产品</h2>
        <input type="hidden" id="editId" value="" />

        <div class="form-group">
          <label>产品分类</label>
          <select id="productCategory">
            <option value="bedding">BEDDING</option>
            <option value="rugs">MATS</option>
            <option value="pet">PET</option>
            <option value="wares">ACCESSORIES</option>
            <option value="curtains">CURTAINS</option>
            <option value="outdoor">OUTDOOR</option>
          </select>
        </div>

        <div class="form-group" id="subCategoryGroup">
          <label>产品细分类</label>
          <select id="productName">
            <option value="BEDDING-Blanket">BEDDING-Blanket</option>
            <option value="BEDDING-Cushion">BEDDING-Cushion</option>
            <option value="BEDDING-Mattress protector">BEDDING-Mattress protector</option>
            <option value="BEDDING-Duvet Cover & Pillowcase Set">BEDDING-Duvet Cover & Pillowcase Set</option>
          </select>
        </div>

        <div class="form-group">
          <label>产品描述</label>
          <textarea id="productDesc" placeholder="产品简要描述"></textarea>
        </div>

        <!-- 产品参数字段：与详情页参数表一致 -->
        <div class="form-group">
          <label>材质 / Material（如 100% 涤纶超细纤维）</label>
          <input type="text" id="productMaterial" placeholder="例：100% 涤纶超细纤维（Microfiber Polyester）" />
        </div>
        <div class="form-group">
          <label>克重 / Weight（如 280gsm）</label>
          <input type="text" id="productWeight" placeholder="例：280gsm" />
        </div>
        <div class="form-group">
          <label>缝制工艺 / Sewing</label>
          <input type="text" id="productSewing" placeholder="例：包边缝 / 锁边 + 贴标" />
        </div>
        <div class="form-group">
          <label>尺寸 / Size（如 127x152cm）</label>
          <input type="text" id="productSize" placeholder="例：127x152cm" />
        </div>
        <div class="form-group">
          <label>颜色 / Color</label>
          <input type="text" id="productColor" placeholder="例：Beige / Grey / Custom" />
        </div>
        <div class="form-group">
          <label>包装 / Package</label>
          <input type="text" id="productPackaging" placeholder="例：PVC 袋 + 入箱" />
        </div>
        <div class="form-group">
          <label>起订量 / MOQ（如 500 套）</label>
          <input type="text" id="productMoq" placeholder="例：500 套" />
        </div>

        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="newlyLaunchedCheck" style="width:16px;height:16px;cursor:pointer;" />
            <span>加入最新上架（NEWLY LAUNCHED）</span>
          </label>
        </div>

        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="bestsellerCheck" style="width:16px;height:16px;cursor:pointer;" />
            <span>加入畅销系列（Bestselling Collections）</span>
          </label>
        </div>

        <div class="form-group">
          <label>产品图片（可多选）</label>
          <div class="upload-area" id="uploadArea">
            <div class="icon">+</div>
            <p>点击或拖拽图片到此处上传</p>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
          </div>
          <div class="upload-preview" id="uploadPreview"></div>
        </div>

        <div style="display:flex;gap:12px;margin-top:24px;">
          <button class="admin-btn primary" id="saveBtn" style="flex:1;">上传产品</button>
          <button class="admin-btn" id="resetBtn">重置</button>
        </div>
      </div>

      <!-- 右侧产品列表 -->
      <div class="product-admin-list">
        <div class="list-header">
          <h2>产品列表 (<span id="totalCount">0</span>)</h2>
          <div class="list-filters">
            <div class="filter-item">
              <select id="filterCategory">
                <option value="">全部分类</option>
                <option value="latest">最新上架（对应首页 NEWLY LAUNCHED）</option>
                <option value="bestsellers">畅销系列（对应首页 Bestselling Collections）</option>
                <option value="bedding">BEDDING</option>
                <option value="rugs">MATS</option>
                <option value="pet">PET</option>
                <option value="wares">ACCESSORIES</option>
                <option value="curtains">CURTAINS</option>
                <option value="outdoor">OUTDOOR</option>
              </select>
            </div>
            <div class="filter-item">
              <select id="filterSubcategory">
                <option value="">全部细分类</option>
              </select>
            </div>
            <div class="filter-item filter-search">
              <span class="search-icon">⌕</span>
              <input type="text" id="searchInput" placeholder="搜索产品名称、分类..." />
            </div>
          </div>
        </div>
        <div class="scroll-area" id="scrollArea">
          <div id="productList"></div>
        </div>
      </div>
    </div>

    <!-- 留言信息 -->
    <div class="product-admin-list message-admin-list">
      <div class="list-header">
        <h2>留言信息 (<span id="msgTotalCount">0</span>)</h2>
        <div class="list-filters">
          <button class="admin-btn" id="refreshMsgBtn">刷新</button>
          <button class="admin-btn" id="clearMsgBtn">清空留言</button>
        </div>
      </div>
      <div class="scroll-area" id="msgScrollArea">
        <div id="msgList"></div>
      </div>
    </div>
  </div>

  <!-- 确认上传对话框 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <h3>确认上传产品</h3>
      <p id="confirmText">确定要上传此产品吗？</p>
      <div class="modal-actions">
        <button class="cancel-btn" id="modalCancel">取消</button>
        <button class="confirm-btn" id="modalConfirm">确认上传</button>
      </div>
    </div>
  </div>

  <script src="js/products-db.js?v=20261036"></script>
  <script src="js/messages-db.js?v=20261028"></script>
  <script>
    var currentImages = [];
    var editingId = null;
    var editedNewlyOrder = null;   // 编辑时记录原有 newlyLaunchedOrder
    var editedBestOrder = null;    // 编辑时记录原有 bestsellerOrder

    // DOM
    var uploadArea = document.getElementById('uploadArea');
    var productCategory = document.getElementById('productCategory');
    var productName = document.getElementById('productName');

    // 各主分类对应的细分类
    var subcategoryMap = {
      bedding: [
        { value: 'BEDDING-Blanket', label: 'BEDDING-Blanket' },
        { value: 'BEDDING-Cushion', label: 'BEDDING-Cushion' },
        { value: 'BEDDING-Mattress protector', label: 'BEDDING-Mattress protector' },
        { value: 'BEDDING-Duvet Cover & Pillowcase Set', label: 'BEDDING-Duvet Cover & Pillowcase Set' }
      ],
      rugs: [
        { value: 'MATS-Placemat', label: 'MATS-Placemat' }
      ],
      curtains: [
        { value: 'Grommet Curtains', label: 'Grommet Curtains' },
        { value: 'Track Curtains', label: 'Track Curtains' }
      ]
    };

    var subCategoryGroup = document.getElementById('subCategoryGroup');

    // 根据主分类刷新细分类下拉：无细分类则隐藏该字段
    function updateSubcategory() {
      var cat = productCategory.value;
      var subs = subcategoryMap[cat] || [];
      productName.innerHTML = '';
      if (subs.length === 0) {
        subCategoryGroup.style.display = 'none';
        return;
      }
      subCategoryGroup.style.display = '';
      subs.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.value;
        opt.textContent = s.label;
        productName.appendChild(opt);
      });
    }

    // 主分类切换时联动刷新细分类
    productCategory.addEventListener('change', updateSubcategory);

    // 获取最终分类值（根据细分类）
    function getFinalCategory() {
      var cat = productCategory.value;
      var name = productName.value;
      if (cat === 'bedding' && name) {
        if (name === 'BEDDING-Blanket') return 'bedding-blanket';
        if (name === 'BEDDING-Cushion') return 'bedding-cushion';
        if (name === 'BEDDING-Mattress protector') return 'bedding-mattress-protector';
        if (name === 'BEDDING-Duvet Cover & Pillowcase Set') return 'bedding-duvet-cover-pillowcase-set';
      }
      if (cat === 'rugs' && name) {
        if (name === 'MATS-Placemat') return 'rugs-placemat';
      }
      if (cat === 'curtains' && name) {
        if (name === 'Grommet Curtains') return 'curtains-grommet';
        if (name === 'Track Curtains') return 'curtains-track';
      }
      return cat;
    }

    // 初始化细分类状态
    updateSubcategory();
    var fileInput = document.getElementById('fileInput');
    var uploadPreview = document.getElementById('uploadPreview');
    var saveBtn = document.getElementById('saveBtn');
    var resetBtn = document.getElementById('resetBtn');
    var productList = document.getElementById('productList');
    var totalCount = document.getElementById('totalCount');
    var formTitle = document.getElementById('formTitle');
    var editIdEl = document.getElementById('editId');
    var exportBtn = document.getElementById('exportBtn');
    var importBtn = document.getElementById('importBtn');
    var importFile = document.getElementById('importFile');

    // 图片上传
    uploadArea.addEventListener('click', function() { fileInput.click(); });
    uploadArea.addEventListener('dragover', function(e) {
      e.preventDefault();
      uploadArea.style.borderColor = '#1a1a1a';
    });
    uploadArea.addEventListener('dragleave', function() {
      uploadArea.style.borderColor = '#ddd';
    });
    uploadArea.addEventListener('drop', function(e) {
      e.preventDefault();
      uploadArea.style.borderColor = '#ddd';
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', function() {
      handleFiles(fileInput.files);
      fileInput.value = '';
    });

    function handleFiles(files) {
      var promises = [];
      for (var i = 0; i < files.length; i++) {
        promises.push(ProductsDB.fileToBase64(files[i]));
      }
      Promise.all(promises).then(function(results) {
        currentImages = currentImages.concat(results);
        renderPreview();
      });
    }

    var dragSrcIdx = null;

    function renderPreview() {
      uploadPreview.innerHTML = '';
      currentImages.forEach(function(src, idx) {
        var item = document.createElement('div');
        item.className = 'preview-item';
        item.draggable = true;
        item.dataset.idx = idx;

        var img = document.createElement('img');
        img.src = src;
        img.draggable = false; /* 禁止图片原生拖拽，避免抢占排序拖拽 */
        var handle = document.createElement('div');
        handle.className = 'drag-handle';
        handle.textContent = '≡';
        var btn = document.createElement('button');
        btn.className = 'remove-img';
        btn.textContent = '×';
        btn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          currentImages.splice(idx, 1);
          renderPreview();
        };

        item.appendChild(img);
        item.appendChild(handle);
        item.appendChild(btn);

        // 拖拽排序
        item.addEventListener('dragstart', function(e) {
          dragSrcIdx = parseInt(item.dataset.idx, 10);
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          /* Firefox 必须 setData 才会启动拖拽会话 */
          e.dataTransfer.setData('text/plain', item.dataset.idx);
        });
        item.addEventListener('dragend', function() {
          item.classList.remove('dragging');
          document.querySelectorAll('.preview-item').forEach(function(el) {
            el.classList.remove('drag-over');
          });
          uploadPreview.classList.remove('drag-zone');
        });
        item.addEventListener('dragover', function(e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          item.classList.add('drag-over');
        });
        item.addEventListener('dragleave', function() {
          item.classList.remove('drag-over');
        });
        item.addEventListener('drop', function(e) {
          e.preventDefault();
          e.stopPropagation();
          item.classList.remove('drag-over');
          uploadPreview.classList.remove('drag-zone');
          var targetIdx = parseInt(item.dataset.idx, 10);
          if (dragSrcIdx === null) return;

          /* 落在缩略图左半 → 插到它前面；落在右半 → 插到它后面。
             这样「放到最后一位」也拖得到（拖到最后一张的右半即可）。 */
          var rect = item.getBoundingClientRect();
          var insertAfter = (e.clientX - rect.left) > rect.width / 2;

          var moved = currentImages.splice(dragSrcIdx, 1)[0];
          var at = targetIdx - (dragSrcIdx < targetIdx ? 1 : 0) + (insertAfter ? 1 : 0);
          currentImages.splice(at, 0, moved);
          dragSrcIdx = null;
          renderPreview();
        });

        uploadPreview.appendChild(item);
      });
    }

    /* 拖到缩略图右侧/下方的空白区域 → 直接放到最后一位 */
    uploadPreview.addEventListener('dragover', function(e) {
      if (dragSrcIdx === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      /* 仅当真正落在网格空白处（而非某张缩略图上）时才高亮，避免干扰 */
      if (e.target === uploadPreview) uploadPreview.classList.add('drag-zone');
    });
    uploadPreview.addEventListener('drop', function(e) {
      if (dragSrcIdx === null) return;
      e.preventDefault();
      e.stopPropagation();
      uploadPreview.classList.remove('drag-zone');
      var moved = currentImages.splice(dragSrcIdx, 1)[0];
      currentImages.push(moved);
      dragSrcIdx = null;
      renderPreview();
    });

    // 上传产品（弹出确认对话框）
    var confirmModal = document.getElementById('confirmModal');
    var modalCancel = document.getElementById('modalCancel');
    var modalConfirm = document.getElementById('modalConfirm');
    var confirmText = document.getElementById('confirmText');

    saveBtn.addEventListener('click', function() {
      var hasSub = subCategoryGroup.style.display !== 'none';
      var name = hasSub ? productName.value : '';
      var mainCatText = productCategory.options[productCategory.selectedIndex].text;
      var categoryText = hasSub ? (mainCatText + ' / ' + name) : mainCatText;
      var display = hasSub ? name : mainCatText;

      if (currentImages.length === 0) { alert('请至少上传一张图片'); return; }

      // 显示确认对话框
      confirmText.textContent = '确认上传「' + display + '」到「' + categoryText + '」吗？共 ' + currentImages.length + ' 张图片。';
      confirmModal.classList.add('show');
    });

    modalCancel.addEventListener('click', function() {
      confirmModal.classList.remove('show');
    });

    modalConfirm.addEventListener('click', function() {
      confirmModal.classList.remove('show');

      var category = getFinalCategory();
      var hasSub = subCategoryGroup.style.display !== 'none';
      var name = hasSub ? productName.value : productCategory.options[productCategory.selectedIndex].text;
      var desc = document.getElementById('productDesc').value.trim();

      var isBestseller = document.getElementById('bestsellerCheck').checked;
      var isNewlyLaunched = document.getElementById('newlyLaunchedCheck').checked;
      var product = {
        id: editingId || (category + '-' + Date.now()),
        category: category,
        name: name,
        description: desc,
        material: document.getElementById('productMaterial').value.trim(),
        weight: document.getElementById('productWeight').value.trim(),
        sewing: document.getElementById('productSewing').value.trim(),
        size: document.getElementById('productSize').value.trim(),
        color: document.getElementById('productColor').value.trim(),
        packaging: document.getElementById('productPackaging').value.trim(),
        moq: document.getElementById('productMoq').value.trim(),
        images: currentImages,
        bestseller: isBestseller,
        newlyLaunched: isNewlyLaunched,
        newlyLaunchedOrder: isNewlyLaunched ? (editedNewlyOrder || null) : undefined,
        bestsellerOrder: isBestseller ? (editedBestOrder || null) : undefined,
        createdAt: Date.now()
      };

      // 自动置顶：首次勾选时分配新的 order 值
      (function assignOrder(p) {
        if (!editingId) {
          // 新建 → 查当前最大 order + 1
          var keys = [];
          if (p.newlyLaunched && p.newlyLaunchedOrder === null) keys.push('newlyLaunchedOrder');
          if (p.bestseller && p.bestsellerOrder === null) keys.push('bestsellerOrder');
          if (!keys.length) return Promise.resolve(p);
          return ProductsDB.getAll().then(function(all) {
            keys.forEach(function(k) {
              var max = 0;
              all.forEach(function(x) { if (x[k] && x[k] > max) max = x[k]; });
              p[k] = max + 1;
            });
            return p;
          });
        }
        // 编辑：之前没勾选现在勾上了 → 也自动给值
        var edits = [];
        if (p.newlyLaunched && p.newlyLaunchedOrder === null && !editedNewlyOrder) edits.push('newlyLaunchedOrder');
        if (p.bestseller && p.bestsellerOrder === null && !editedBestOrder) edits.push('bestsellerOrder');
        if (!edits.length) return Promise.resolve(p);
        return ProductsDB.getAll().then(function(all) {
          edits.forEach(function(k) {
            var max = 0;
            all.forEach(function(x) { if (x[k] && x[k] > max) max = x[k]; });
            p[k] = max + 1;
          });
          return p;
        });
      })(product).then(function(finalProduct) {
        var promise = editingId ? ProductsDB.update(finalProduct) : ProductsDB.add(finalProduct);
        promise.then(function() {
          alert(editingId ? '产品已更新' : '产品上传成功');
          softResetForm();
          loadProducts();
        }).catch(function(err) {
          alert('上传失败：' + err.message);
        });
      });
    });

    // 点击遮罩关闭
    confirmModal.addEventListener('click', function(e) {
      if (e.target === confirmModal) confirmModal.classList.remove('show');
    });

    // 重置表单
    resetBtn.addEventListener('click', resetForm);

    function resetForm() {
      productCategory.value = 'bedding';
      updateSubcategory();
      productName.value = 'BEDDING-Blanket';
      document.getElementById('productDesc').value = '';
      document.getElementById('productMaterial').value = '';
      document.getElementById('productWeight').value = '';
      document.getElementById('productSewing').value = '';
      document.getElementById('productSize').value = '';
      document.getElementById('productColor').value = '';
      document.getElementById('productPackaging').value = '';
      document.getElementById('productMoq').value = '';
      document.getElementById('bestsellerCheck').checked = false;
      document.getElementById('newlyLaunchedCheck').checked = false;
      currentImages = [];
      editingId = null;
      editedNewlyOrder = null;
      editedBestOrder = null;
      editIdEl.value = '';
      formTitle.textContent = '添加新产品';
      saveBtn.textContent = '上传产品';
      renderPreview();
    }

    // 上传成功后软重置：保留当前选定的分类，仅清空图片与描述，便于连续上传同分类产品
    function softResetForm() {
      // 保留 productCategory 与 productName（细分类）的当前选择
      document.getElementById('productDesc').value = '';
      document.getElementById('productMaterial').value = '';
      document.getElementById('productWeight').value = '';
      document.getElementById('productSewing').value = '';
      document.getElementById('productSize').value = '';
      document.getElementById('productColor').value = '';
      document.getElementById('productPackaging').value = '';
      document.getElementById('productMoq').value = '';
      document.getElementById('bestsellerCheck').checked = false;
      document.getElementById('newlyLaunchedCheck').checked = false;
      currentImages = [];
      editingId = null;
      editedNewlyOrder = null;
      editedBestOrder = null;
      editIdEl.value = '';
      formTitle.textContent = '添加新产品';
      saveBtn.textContent = '上传产品';
      renderPreview();
    }

    // 加载产品列表
    var allProducts = [];
    var searchInput = document.getElementById('searchInput');
    var filterCategory = document.getElementById('filterCategory');
    var filterSubcategory = document.getElementById('filterSubcategory');

    // 筛选用：主分类 → 细分类（value 为存储的 category 值）
    var filterSubMap = {
      bedding: [
        { value: 'bedding-blanket', label: 'BEDDING-Blanket' },
        { value: 'bedding-cushion', label: 'BEDDING-Cushion' },
        { value: 'bedding-mattress-protector', label: 'BEDDING-Mattress protector' },
        { value: 'bedding-duvet-cover-pillowcase-set', label: 'BEDDING-Duvet Cover & Pillowcase Set' }
      ],
      rugs: [
        { value: 'rugs-placemat', label: 'MATS-Placemat' }
      ],
      curtains: [
        { value: 'curtains-grommet', label: 'Grommet Curtains' },
        { value: 'curtains-track', label: 'Track Curtains' }
      ]
    };

    // 根据主分类刷新细分类下拉
    function updateFilterSubcategory() {
      var cat = filterCategory.value;
      filterSubcategory.innerHTML = '<option value="">全部细分类</option>';
      filterSubcategory.disabled = false;
      if (cat === 'latest' || cat === 'bestsellers') {
        filterSubcategory.innerHTML = '<option value="">— 不适用 —</option>';
        filterSubcategory.disabled = true;
        filterSubcategory.style.display = '';
        return;
      }
      var subs = filterSubMap[cat] || [];
      if (subs.length === 0) {
        filterSubcategory.style.display = 'none';
        return;
      }
      filterSubcategory.style.display = '';
      subs.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.value;
        opt.textContent = s.label;
        filterSubcategory.appendChild(opt);
      });
    }

    function loadProducts() {
      ProductsDB.getAll().then(function(products) {
        products.sort(function(a, b) {
          return (b.createdAt || 0) - (a.createdAt || 0);
        });
        allProducts = products;
        totalCount.textContent = products.length;
        applySearch();
      }).catch(function(err) {
        console.error('加载产品失败:', err);
      });
    }

    // 页面可见时自动刷新
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) loadProducts();
    });

    function applySearch() {
      var keyword = searchInput.value.trim().toLowerCase();
      var catFilter = filterCategory.value;
      var subFilter = filterSubcategory.value;
      var filtered = allProducts;

      // 主分类过滤：匹配主分类值或主分类前缀
      if (catFilter) {
        if (catFilter === 'latest') {
          // 最新上架：仅显示后台勾选了"加入最新上架"的全部产品，按 newlyLaunchedOrder 升序
          filtered = filtered.filter(function(p) { return p.newlyLaunched === true; });
          filtered.sort(function(a, b) { return (a.newlyLaunchedOrder || 99999) - (b.newlyLaunchedOrder || 99999); });
        } else if (catFilter === 'bestsellers') {
          // 畅销系列：带 bestseller 标记的全部，按 bestsellerOrder 升序
          filtered = filtered.filter(function(p) { return p.bestseller === true; });
          filtered.sort(function(a, b) { return (a.bestsellerOrder || 99999) - (b.bestsellerOrder || 99999); });
        } else {
          filtered = filtered.filter(function(p) {
            var pc = (p.category || '').toLowerCase();
            return pc === catFilter || pc.indexOf(catFilter + '-') === 0;
          });
        }
      }
      // 细分类过滤：精确匹配 category 值（仅主分类模式下生效）
      if (subFilter && catFilter !== 'latest' && catFilter !== 'bestsellers') {
        filtered = filtered.filter(function(p) {
          return (p.category || '').toLowerCase() === subFilter;
        });
      }
      // 关键词过滤
      if (keyword) {
        filtered = filtered.filter(function(p) {
          var name = (p.name || '').toLowerCase();
          var cat = (p.category || '').toLowerCase();
          var desc = (p.description || '').toLowerCase();
          var categoryNames = {
            bedding: 'bedding', rugs: 'mats', pet: 'pet',
            wares: 'accessories', curtains: 'curtains', outdoor: 'outdoor'
          };
          var catFull = (categoryNames[p.category] || '').toLowerCase();
          return name.indexOf(keyword) !== -1 ||
                 cat.indexOf(keyword) !== -1 ||
                 catFull.indexOf(keyword) !== -1 ||
                 desc.indexOf(keyword) !== -1;
        });
      }
      var hasFilter = keyword || catFilter || subFilter;
      totalCount.textContent = filtered.length + (hasFilter ? ' / ' + allProducts.length : '');
      renderList(filtered);
    }

    searchInput.addEventListener('input', applySearch);
    filterCategory.addEventListener('change', function() {
      updateFilterSubcategory();
      applySearch();
    });
    filterSubcategory.addEventListener('change', applySearch);

    function renderList(products) {
      if (products.length === 0) {
        productList.innerHTML = '<div class="empty-state"><p>暂无产品，请使用左侧表单添加</p></div>';
        return;
      }
      var catFilter = filterCategory.value;
      // 是否允许"真删除"：仅在"全部分类"视图下
      var allowDelete = !catFilter;
      // 是否启用拖拽排序：仅最新上架 / 畅销系列视图
      var enableDrag = (catFilter === 'latest' || catFilter === 'bestsellers');
      // 当前视图下按钮的文字与行为说明
      var actionLabel = allowDelete ? '删除' :
          (catFilter === 'bestsellers' ? '移出畅销' :
           catFilter === 'latest' ? '移出最新上架' : '移出分类');

      var categoryNames = {
        bedding: 'BEDDING', 'bedding-blanket': 'BEDDING / blanket', 'bedding-cushion': 'BEDDING / cushion',
        'bedding-mattress-protector': 'BEDDING / Mattress protector', 'bedding-duvet-cover-pillowcase-set': 'BEDDING / Duvet Cover & Pillowcase Set',
        rugs: 'MATS', pet: 'PET', wares: 'ACCESSORIES', curtains: 'CURTAINS',
        'curtains-grommet': 'CURTAINS / Grommet Curtains', 'curtains-track': 'CURTAINS / Track Curtains', outdoor: 'OUTDOOR'
      };
      var html = '';
      products.forEach(function(p) {
        var thumb = p.images && p.images[0] ? p.images[0] : '';
        var imgCount = p.images ? p.images.length : 0;
        var catLabel = (p.category === '') ? '<span style="color:#999;">未分类</span>' : (categoryNames[p.category] || p.category);
        html += '<div class="admin-product-item' + (enableDrag ? ' drag-item' : '') + '" data-id="' + p.id + '">';
        if (enableDrag) {
          html += '<input type="checkbox" class="row-checkbox" data-id="' + p.id + '" />';
          html += '<div class="drag-handle" title="拖动排序">⋮⋮</div>';
        }
        html += '<div class="thumb">' + (thumb ? '<img src="' + thumb + '" alt="">' : '') + '</div>';
        html += '<div class="info">';
        html += '<span class="badge">' + catLabel + '</span>';
        if (p.newlyLaunched) html += '<span class="badge" style="background:#e8f0e0;color:#4a7c2a;">最新上架</span>';
        if (p.bestseller) html += '<span class="badge" style="background:#f5e6d3;color:#a06b1f;">畅销</span>';
        html += '<span class="badge">' + imgCount + ' 张图</span>';
        html += '<h3>' + (p.name || '未命名') + '</h3>';
        html += '<p>' + (p.description || '无描述') + '</p>';
        html += '</div>';
        html += '<div class="item-actions">';
        html += '<button class="edit-btn" data-id="' + p.id + '">编辑</button>';
        html += '<button class="del-btn" data-id="' + p.id + '">' + actionLabel + '</button>';
        html += '</div>';
        html += '</div>';
      });
      productList.innerHTML = html;

      // 多选工具栏（仅 latest / bestsellers）
      if (enableDrag && products.length > 0) {
        var toolbar = document.createElement('div');
        toolbar.className = 'drag-toolbar';
        toolbar.innerHTML =
          '<label class="drag-toolbar__select"><input type="checkbox" class="select-all-cb" /> 全选</label>' +
          '<span class="drag-toolbar__hint">拖动任意手柄可整组移动</span>';
        productList.insertBefore(toolbar, productList.firstChild);

        // 全选
        toolbar.querySelector('.select-all-cb').addEventListener('change', function(e) {
          var rows = productList.querySelectorAll('.row-checkbox');
          rows.forEach(function(cb) { cb.checked = e.target.checked; });
          updateSelectedHighlight();
        });

        // 单行勾选
        productList.querySelectorAll('.row-checkbox').forEach(function(cb) {
          cb.addEventListener('change', updateSelectedHighlight);
        });
      }

      // 拖拽提示条
      var hintBar = productList.querySelector('.drag-hint');
      if (enableDrag && products.length > 0 && !hintBar) {
        var hint = document.createElement('div');
        hint.className = 'drag-hint';
        hint.textContent = '💡 拖动左侧 ⋮⋮ 手柄可调整顺序，拖完自动保存';
        productList.insertBefore(hint, productList.firstChild);
      }

      // 绑定按钮
      productList.querySelectorAll('.edit-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          editProduct(btn.getAttribute('data-id'));
        });
      });
      productList.querySelectorAll('.del-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var id = btn.getAttribute('data-id');
          if (allowDelete) {
            // 全部分类 → 真删除产品
            if (!confirm('确认删除此产品？删除后无法恢复。')) return;
            deleteProduct(id);
          } else {
            // 分类视图 → 只移出当前视图，不删除产品
            unassignFromView(id, catFilter);
          }
        });
      });

      // 拖拽排序绑定（仅 latest / bestsellers 视图）
      if (enableDrag) {
        bindDragSort(catFilter);
      }
    }

    // 更新选中行高亮样式
    function updateSelectedHighlight() {
      productList.querySelectorAll('.drag-item').forEach(function(row) {
        var cb = row.querySelector('.row-checkbox');
        row.classList.toggle('is-selected', cb && cb.checked);
      });
    }

    // 拖拽排序（单选 / 多选整组）
    function bindDragSort(viewKey) {
      var state = null;   // { dragging, selected, ghost, hintLine, offsetY }
      var items = productList.querySelectorAll('.drag-item');

      items.forEach(function(item) {
        var handle = item.querySelector('.drag-handle');
        if (!handle) return;
        handle.addEventListener('pointerdown', function(e) {
          e.preventDefault();
          e.stopPropagation();

          // 收集当前选中组（至少包含被拖的这一行）
          var selected = [];
          if (item.classList.contains('is-selected')) {
            // 已在选中组 → 拖整组，保持 DOM 顺序
            productList.querySelectorAll('.drag-item.is-selected').forEach(function(r) {
              selected.push(r);
            });
          } else {
            // 未选中 → 只拖这一行
            selected = [item];
          }

          // 如果被拖的这行没选中，其它行也没有选中 → 清空之前的多选高亮
          if (selected.length === 1) {
            productList.querySelectorAll('.drag-item').forEach(function(r) {
              r.classList.toggle('is-selected', r === item);
            });
            var cb = item.querySelector('.row-checkbox');
            if (cb) cb.checked = false;
          }

          var firstRect = selected[0].getBoundingClientRect();
          state = {
            dragging: item,
            selected: selected,
            offsetY: firstRect.top - e.clientY,
            ghost: null, hintLine: null
          };
          handle.setPointerCapture(e.pointerId);

          // 创建"幽灵"副本：多选时显示堆叠在一起的压缩预览
          var ghostWrap = document.createElement('div');
          ghostWrap.className = 'drag-ghost';
          ghostWrap.style.position = 'fixed';
          ghostWrap.style.width = firstRect.width + 'px';
          ghostWrap.style.left = firstRect.left + 'px';
          ghostWrap.style.top = firstRect.top + 'px';
          ghostWrap.style.zIndex = '9999';
          ghostWrap.style.pointerEvents = 'none';

          // 把选中行的缩略内容塞进幽灵（多选时显示多行堆叠感）
          selected.forEach(function(srow, idx) {
            var ghostRow = srow.cloneNode(true);
            ghostRow.classList.remove('drag-item', 'is-selected');
            ghostRow.style.opacity = (idx === 0) ? '1' : '0.7';
            ghostRow.style.marginTop = (idx === 0) ? '0' : '-2px';
            ghostRow.style.borderBottom = (idx === selected.length - 1) ? '' : 'none';
            ghostRow.style.boxShadow = 'none';
            ghostRow.querySelector('.row-checkbox').checked = true;
            ghostRow.querySelector('.row-checkbox').style.pointerEvents = 'none';
            ghostWrap.appendChild(ghostRow);
          });
          document.body.appendChild(ghostWrap);
          state.ghost = ghostWrap;

          // 被拖组整体降透明
          selected.forEach(function(r) { r.style.opacity = '0.25'; });

          // 插入指示线
          var line = document.createElement('div');
          line.className = 'drag-hint-line';
          document.body.appendChild(line);
          state.hintLine = line;
        });

        handle.addEventListener('pointermove', function(e) {
          if (!state) return;
          var y = e.clientY + state.offsetY;
          state.ghost.style.top = y + 'px';

          // 找插入位置（按组首行计算）
          var target = null;
          var insertAfter = false;
          var groupSet = {};
          state.selected.forEach(function(r) { groupSet[r.getAttribute('data-id')] = true; });

          // 收集可见的非本组目标
          var allTargets = [];
          productList.querySelectorAll('.drag-item').forEach(function(it) {
            if (!groupSet[it.getAttribute('data-id')]) allTargets.push(it);
          });
          // 如果整表都被选中了 → 允许拖到自己之外的位置也没意义
          if (allTargets.length === 0) return;

          for (var i = 0; i < allTargets.length; i++) {
            var it = allTargets[i];
            var r = it.getBoundingClientRect();
            if (e.clientY >= r.top && e.clientY <= r.bottom) {
              target = it;
              insertAfter = (e.clientY - r.top) / r.height > 0.5;
              break;
            }
          }
          if (!target) {
            var firstTop = allTargets[0].getBoundingClientRect().top;
            var lastBottom = allTargets[allTargets.length - 1].getBoundingClientRect().bottom;
            if (e.clientY < firstTop) {
              target = allTargets[0]; insertAfter = false;
            } else if (e.clientY > lastBottom) {
              target = allTargets[allTargets.length - 1]; insertAfter = true;
            }
          }

          if (target) {
            var tr = target.getBoundingClientRect();
            var lineTop = insertAfter ? tr.bottom + 'px' : tr.top + 'px';
            state.hintLine.style.top = lineTop;
            state.hintLine.style.left = tr.left + 'px';
            state.hintLine.style.width = tr.width + 'px';
          }
          state._target = target;
          state._insertAfter = insertAfter;
        });

        handle.addEventListener('pointerup', function(e) {
          if (!state) return;
          handle.releasePointerCapture(e.pointerId);

          var selected = state.selected;
          var target = state._target;
          var insertAfter = state._insertAfter;

          if (target && selected.length) {
            // 按当前 DOM 顺序组内排序（保证相对顺序）
            var ordered = [];
            productList.querySelectorAll('.drag-item').forEach(function(r) {
              if (state.selected.indexOf(r) !== -1) ordered.push(r);
            });
            ordered.forEach(function(r, idx) {
              if (idx === 0) {
                target.parentNode.insertBefore(r, insertAfter ? target.nextSibling : target);
              } else {
                ordered[idx - 1].parentNode.insertBefore(r, ordered[idx - 1].nextSibling);
              }
            });
            saveOrderFromDOM(viewKey);
          }

          // 清理
          selected.forEach(function(r) { r.style.opacity = ''; });
          state.ghost.remove();
          state.hintLine.remove();
          state = null;
        });

        handle.addEventListener('pointercancel', function() {
          if (state) {
            state.selected.forEach(function(r) { r.style.opacity = ''; });
            if (state.ghost) state.ghost.remove();
            if (state.hintLine) state.hintLine.remove();
            state = null;
          }
        });
      });
    }

    // 按 DOM 当前顺序批量保存 order 字段
    function saveOrderFromDOM(viewKey) {
      var key = (viewKey === 'latest') ? 'newlyLaunchedOrder' : 'bestsellerOrder';
      var ids = [];
      productList.querySelectorAll('.drag-item').forEach(function(el) {
        ids.push(el.getAttribute('data-id'));
      });

      ProductsDB.getAll().then(function(list) {
        var updates = [];
        ids.forEach(function(id, idx) {
          var p = list.find(function(x) { return x.id === id; });
          if (p && p[key] !== idx + 1) {
            p[key] = idx + 1;
            updates.push(ProductsDB.update(p));
          }
        });
        // 同时清理掉不在当前视图里的旧排序值（比如移出的产品还留着 order）
        list.forEach(function(p) {
          if (p[key] && ids.indexOf(p.id) === -1) {
            p[key] = 99999;
            updates.push(ProductsDB.update(p));
          }
        });
        if (updates.length) return Promise.all(updates);
      }).then(function() {
        loadProducts();
      });
    }

    // 在非"全部分类"视图下把产品移出（只取消对应标记，不删除数据）
    function unassignFromView(id, viewKey) {
      var prompts = {
        latest: '确认将此产品从"最新上架"移出？产品数据仍保留，仅取消勾选"加入最新上架"。',
        bestsellers: '确认将此产品移出"畅销系列"？产品数据仍保留，仅取消畅销标记。'
      };
      var msg = prompts[viewKey] || '确认将此产品移出当前分类？产品数据仍保留，可在"全部分类"视图看到。';
      if (!confirm(msg)) return;

      ProductsDB.getAll().then(function(list) {
        var p = list.find(function(x) { return x.id === id; });
        if (!p) return;
        if (viewKey === 'bestsellers') {
          p.bestseller = false;
        } else if (viewKey === 'latest') {
          p.newlyLaunched = false;
        } else {
          p.category = '';
        }
        return ProductsDB.update(p);
      }).then(function() {
        loadProducts();
      });
    }

    // 编辑产品
    function editProduct(id) {
      ProductsDB.getAll().then(function(products) {
        var p = products.find(function(x) { return x.id === id; });
        if (!p) return;
        editingId = p.id;
        editedNewlyOrder = p.newlyLaunchedOrder || null;
        editedBestOrder = p.bestsellerOrder || null;
        editIdEl.value = p.id;
        formTitle.textContent = '编辑产品';
        saveBtn.textContent = '更新产品';
        // 恢复分类
        var cat = p.category || 'bedding';
        if (cat.indexOf('bedding-') === 0) {
          productCategory.value = 'bedding';
        } else {
          productCategory.value = cat;
        }
        updateSubcategory();
        // 仅 bedding 有细分类，回填细分类名称
        if (productCategory.value === 'bedding' && p.name) {
          productName.value = p.name;
        }
        document.getElementById('productDesc').value = p.description || '';
        document.getElementById('productMaterial').value = p.material || '';
        document.getElementById('productWeight').value = p.weight || '';
        document.getElementById('productSewing').value = p.sewing || '';
        document.getElementById('productSize').value = p.size || '';
        document.getElementById('productColor').value = p.color || '';
        document.getElementById('productPackaging').value = p.packaging || '';
        document.getElementById('productMoq').value = p.moq || '';
        document.getElementById('bestsellerCheck').checked = !!p.bestseller;
        document.getElementById('newlyLaunchedCheck').checked = !!p.newlyLaunched;
        currentImages = p.images ? p.images.slice() : [];
        renderPreview();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    });

      var reader = new FileReader();
      reader.onload = function() {
        ProductsDB.importData(reader.result).then(function() {
          alert('导入成功');
          loadProducts();
        }).catch(function(err) {

    // ============ 留言信息 ============
    var msgList = document.getElementById('msgList');
    var msgTotalCount = document.getElementById('msgTotalCount');

    var subjectFallback = '未填写咨询类型';

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function formatMsgTime(ts) {
      var d = new Date(ts || 0);
      function pad(n) { return n < 10 ? '0' + n : '' + n; }
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function renderMessages(list) {
      msgTotalCount.textContent = list.length;
      if (!list.length) {
        msgList.innerHTML = '<div class="empty-state"><p>暂无留言</p></div>';
        return;
      }
      var html = '';
      list.forEach(function (m) {
        html += '<div class="admin-product-item" data-id="' + m.id + '">';
        html += '<div class="info">';
        html += '<span class="badge">' + (escapeHtml(m.subject) || subjectFallback) + '</span>';
        html += '<span class="badge">' + formatMsgTime(m.createdAt) + '</span>';
        html += '<h3>' + escapeHtml(m.name) + ' · ' + escapeHtml(m.phone) + '</h3>';
        if (m.email) html += '<p>邮箱：' + escapeHtml(m.email) + '</p>';
        html += '<p>' + escapeHtml(m.message) + '</p>';
        html += '</div>';
        html += '<div class="item-actions">';
        html += '<button class="del-btn" data-id="' + m.id + '">删除</button>';
        html += '</div>';
        html += '</div>';
      });
      msgList.innerHTML = html;

      msgList.querySelectorAll('.del-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('确认删除这条留言？')) return;
          MessagesDB.remove(btn.getAttribute('data-id')).then(loadMessages);
        });
      });
    }

    function loadMessages() {
      MessagesDB.getAll().then(renderMessages).catch(function (err) {
        msgList.innerHTML = '<div class="empty-state"><p>读取留言失败：' + escapeHtml(err.message) + '</p></div>';
      });
    }

    document.getElementById('refreshMsgBtn').addEventListener('click', loadMessages);
    document.getElementById('clearMsgBtn').addEventListener('click', function () {
      if (!confirm('确认清空全部留言？此操作不可恢复。')) return;
      MessagesDB.clearAll().then(loadMessages);
